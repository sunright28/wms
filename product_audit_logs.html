<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS 產品主檔變更履歷查詢</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen p-4 md:p-8">

    <script>
        let CURRENT_USER_NAME = "";
        let CURRENT_USER_ROLE = "";

        (function() {
            const cachedData = sessionStorage.getItem("currentUser");
            if (!cachedData) {
                alert("🚨 安全警告：偵測到非法存取！請先從主系統登入驗證。");
                window.location.href = "index.html";
                return;
            }
            try {
                const userObj = JSON.parse(cachedData);
                CURRENT_USER_NAME = userObj.display_name || userObj.username;
                CURRENT_USER_ROLE = userObj.role ? userObj.role.trim().toLowerCase() : "user";
            } catch (e) {
                sessionStorage.removeItem("currentUser");
                window.location.href = "index.html";
            }
        })();
    </script>

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- 頁頭標題 -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-800/60 p-4 rounded-2xl border border-slate-700/50 gap-4 shadow-lg">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-500/20 text-indigo-400 p-3 rounded-xl border border-indigo-500/30">
                    <i class="fa-solid fa-clock-rotate-left text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-wider text-slate-100">產品主檔變更履歷查詢</h1>
                    <p class="text-xs text-slate-400">登入人員：<span id="user-display" class="text-indigo-400 font-mono font-bold">載入中...</span></p>
                </div>
            </div>
            <a href="index.html" class="text-xs bg-slate-700/50 hover:bg-slate-700 px-3 py-2 rounded-xl text-slate-300 hover:text-white font-medium transition-all cursor-pointer">
                <i class="fa-solid fa-arrow-left mr-1"></i> 回主選單
            </a>
        </div>

        <!-- 單一橫列查詢條件區 -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700/60 shadow-xl space-y-4">
            <h2 class="text-sm font-bold text-slate-300 flex items-center gap-2">
                <i class="fa-solid fa-filter text-indigo-400"></i> 履歷查詢與時段過濾
            </h2>

            <!-- 佈局改為 4 欄條件 + 搜尋按鈕 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-10 gap-3 text-xs items-end">
                <div class="xl:col-span-3">
                    <label class="block font-bold text-slate-400 mb-1">搜尋品號/品名/修改人</label>
                    <input type="text" id="search-keyword" placeholder="輸入品號、品名或姓名（按 Enter 搜尋）" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>

                <div class="xl:col-span-2">
                    <label class="block font-bold text-slate-400 mb-1">異動類型</label>
                    <select id="filter-action" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                        <option value="ALL">全部類別</option>
                        <option value="INSERT">僅新增 (INSERT)</option>
                        <option value="UPDATE">僅修改 (UPDATE)</option>
                    </select>
                </div>

                <div class="xl:col-span-2">
                    <label class="block font-bold text-slate-400 mb-1">起始日期</label>
                    <input type="date" id="start-date" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 font-mono">
                </div>

                <div class="xl:col-span-2">
                    <label class="block font-bold text-slate-400 mb-1">結束日期</label>
                    <input type="date" id="end-date" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 font-mono">
                </div>

                <!-- 搜尋按鈕 -->
                <div class="xl:col-span-1">
                    <button id="btn-search" onclick="fetchAuditLogs()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-3 rounded-xl transition-all cursor-pointer flex items-center justify-center gap-1.5 shadow-md shadow-indigo-600/30">
                        <i class="fa-solid fa-magnifying-glass"></i> 搜尋
                    </button>
                </div>
            </div>
        </div>

        <!-- 履歷列表 -->
        <div class="bg-slate-800 rounded-2xl border border-slate-700/60 shadow-xl overflow-hidden">
            <div class="p-4 border-b border-slate-700/60 flex justify-between items-center">
                <h2 class="text-sm font-bold text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-400"></i> 歷史變更紀錄列表
                </h2>
                <div class="flex items-center gap-3">
                    <span id="record-count" class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full font-mono">共 0 筆記錄</span>
                    <button onclick="resetFilters()" title="重設條件與預設日期" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1 rounded-xl text-xs transition-all cursor-pointer flex items-center gap-1">
                        <i class="fa-solid fa-rotate-left"></i> 重設條件
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 font-bold uppercase tracking-wider border-b border-slate-800">
                        <tr>
                            <th class="p-3 font-mono">ID</th>
                            <th class="p-3">異動時間 (台灣時區)</th>
                            <th class="p-3">品號 (ROW ID)</th>
                            <th class="p-3">品名</th>
                            <th class="p-3">動作</th>
                            <th class="p-3">修改人員</th>
                            <th class="p-3 text-center">變更明細比對</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body" class="divide-y divide-slate-700/40 font-mono">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-slate-500 italic">載入資料中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 (Modal) -->
    <div id="detail-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-800 max-w-2xl w-full rounded-2xl border border-slate-700 shadow-2xl p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 id="modal-title" class="font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-file-code text-indigo-400"></i> 詳細規格變更差異
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-content" class="space-y-3 max-h-[60vh] overflow-y-auto text-xs font-mono"></div>
            <div class="text-right border-t border-slate-700 pt-3">
                <button onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer">關閉視窗</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://mmqvewwmpzutyzrovnkp.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tcXZld3dtcHp1dHl6cm92bmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTE0OTYsImV4cCI6MjA5NTg2NzQ5Nn0.taGVo2jp3Z5BQ0jmZiC0j-Yn5oVryFbHiopHst8NK14";

        let currentLogs = [];

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("user-display").innerText = CURRENT_USER_NAME;
            setDefaultDateRange();
            bindAutoSearchEvents(); // 綁定自動觸發事件
            fetchAuditLogs();
        });

        function setDefaultDateRange() {
            const today = new Date();
            const pastWeek = new Date();
            pastWeek.setDate(today.getDate() - 7);

            document.getElementById("end-date").value = today.toISOString().split('T')[0];
            document.getElementById("start-date").value = pastWeek.toISOString().split('T')[0];
        }

        // 🌟 事件監聽綁定
        function bindAutoSearchEvents() {
            // 1. 文字搜尋框：按下 Enter 鍵時觸發搜尋
            document.getElementById("search-keyword").addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                    event.preventDefault(); // 阻止表單預設行為
                    fetchAuditLogs();
                }
            });

            // 2. 下拉選單與日期選單：切換時自動觸發搜尋
            document.getElementById("filter-action").addEventListener("change", fetchAuditLogs);
            document.getElementById("start-date").addEventListener("change", fetchAuditLogs);
            document.getElementById("end-date").addEventListener("change", fetchAuditLogs);
        }

        async function fetchAuditLogs() {
            const btnSearch = document.getElementById("btn-search");
            const tbody = document.getElementById("logs-table-body");
            const keyword = document.getElementById("search-keyword").value.trim();
            const action = document.getElementById("filter-action").value;
            const startDate = document.getElementById("start-date").value;
            const endDate = document.getElementById("end-date").value;

            btnSearch.disabled = true;
            btnSearch.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 搜尋中`;

            try {
                let queryUrl = `${SUPABASE_URL}/rest/v1/audit_logs?table_name=eq.products&order=id.desc&limit=100`;

                if (action !== "ALL") {
                    queryUrl += `&action=eq.${action}`;
                }

                if (keyword) {
                    const encoded = encodeURIComponent(keyword);
                    queryUrl += `&or=(row_id.ilike.*${encoded}*,row_item.ilike.*${encoded}*,changed_by.ilike.*${encoded}*)`;
                }

                if (startDate) {
                    const startIso = new Date(`${startDate}T00:00:00+08:00`).toISOString();
                    queryUrl += `&changed_at=gte.${startIso}`;
                }

                if (endDate) {
                    const endIso = new Date(`${endDate}T23:59:59+08:00`).toISOString();
                    queryUrl += `&changed_at=lte.${endIso}`;
                }

                const res = await fetch(queryUrl, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });

                if (!res.ok) throw new Error("讀取 Supabase 履歷資料失敗");
                currentLogs = await res.json();

                document.getElementById("record-count").innerText = `共 ${currentLogs.length} 筆記錄`;

                if (currentLogs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500 italic">❌ 找不到符合條件的變更履歷</td></tr>`;
                    return;
                }

                tbody.innerHTML = currentLogs.map(log => {
                    const actionBadge = log.action === 'INSERT' 
                        ? `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded font-bold text-[11px]">INSERT</span>`
                        : `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded font-bold text-[11px]">UPDATE</span>`;
                    
                    const rawTime = log.changed_at || log.created_at || (log.new_data && (log.new_data.updated_at || log.new_data.created_at));
                    
                    const timeFormatted = rawTime 
                        ? new Date(rawTime).toLocaleString('zh-TW', { 
                            timeZone: 'Asia/Taipei', 
                            hour12: false,
                            year: 'numeric',
                            month: '2-digit',
                            day: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit',
                            second: '2-digit'
                          }) 
                        : "-";

                    const itemName = log.row_item || "-";

                    return `
                        <tr class="hover:bg-slate-800/60 transition-colors">
                            <td class="p-3 text-slate-500">${log.id}</td>
                            <td class="p-3 text-slate-300 font-mono">${timeFormatted}</td>
                            <td class="p-3 font-bold text-indigo-400">${log.row_id}</td>
                            <td class="p-3 text-slate-200 font-sans font-medium">${itemName}</td>
                            <td class="p-3">${actionBadge}</td>
                            <td class="p-3 text-slate-200 font-sans font-medium">${log.changed_by || '系統'}</td>
                            <td class="p-3 text-center">
                                <button onclick="showDetails(${log.id})" class="bg-slate-700 hover:bg-indigo-600 text-slate-200 hover:text-white px-2.5 py-1 rounded-lg transition-all cursor-pointer text-xs">
                                    <i class="fa-solid fa-eye"></i> 查看變更
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                alert(`讀取錯誤: ${err.message}`);
            } finally {
                btnSearch.disabled = false;
                btnSearch.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> 搜尋`;
            }
        }

        function showDetails(logId) {
            const log = currentLogs.find(l => l.id === logId);
            if (!log) return;

            const modalContent = document.getElementById("modal-content");
            document.getElementById("modal-title").innerHTML = `<i class="fa-solid fa-file-code text-indigo-400"></i> 品號 [ ${log.row_id} ] 異動明細`;

            if (log.action === "INSERT") {
                modalContent.innerHTML = `
                    <div class="bg-emerald-950/30 border border-emerald-500/30 p-3 rounded-xl">
                        <p class="text-emerald-400 font-bold mb-2">✨ 全新產品建立記錄：</p>
                        <pre class="bg-slate-900 p-3 rounded-lg overflow-x-auto text-slate-300 text-[11px]">${JSON.stringify(log.new_data, null, 2)}</pre>
                    </div>`;
            } else {
                const oldData = log.old_data || {};
                const newData = log.new_data || {};
                let diffHtml = "";

                const allKeys = Array.from(new Set([...Object.keys(oldData), ...Object.keys(newData)]));

                allKeys.forEach(key => {
                    const oldVal = oldData[key];
                    const newVal = newData[key];

                    if (JSON.stringify(oldVal) !== JSON.stringify(newVal)) {
                        diffHtml += `
                            <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-700/60 grid grid-cols-3 gap-2 items-center">
                                <span class="text-indigo-300 font-bold">${key}</span>
                                <span class="text-rose-400 line-through truncate">${oldVal !== null ? oldVal : 'null'}</span>
                                <span class="text-emerald-400 font-bold truncate">➔ ${newVal !== null ? newVal : 'null'}</span>
                            </div>`;
                    }
                });

                modalContent.innerHTML = diffHtml || `<p class="text-slate-500 text-center py-4">無具體欄位差異資訊</p>`;
            }

            document.getElementById("detail-modal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("detail-modal").classList.add("hidden");
        }

        function resetFilters() {
            document.getElementById("search-keyword").value = "";
            document.getElementById("filter-action").value = "ALL";
            setDefaultDateRange();
            fetchAuditLogs();
        }
    </script>
</body>
</html>
